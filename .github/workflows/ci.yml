name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: 코드 스타일 검사
        run: uv run ruff check . && uv run ruff format --check .
      - name: 테스트
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포용 이미지 빌드
        run: docker build -t walkmodoro .
      - name: 컨테이너 실행 확인
        run: |
          docker run -d --rm -p 8000:10000 -e PORT=10000 --name wm walkmodoro
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs wm; exit 1
