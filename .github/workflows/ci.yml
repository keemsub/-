name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: 코드 스타일 검사
        run: uv run ruff check . && uv run ruff format --check .
      - name: 테스트
        run: uv run pytest -q
