<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5fb38a">
  <title>걸음모도로</title>
  <!-- 휴대폰 홈 화면에 앱처럼 추가하기 위한 설정 -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="걸음모도로">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🐢 걸음모도로</h1>
    <p class="sub">집중한 시간만큼, 거북이가 동네를 걸어가요</p>
  </header>

  <section class="card timer-card">
    <div id="clock" class="clock">25:00</div>
    <div class="controls">
      <select id="minutes" aria-label="집중 시간">
        <option value="25" selected>25분</option>
        <option value="50">50분</option>
        <option value="60">60분</option>
      </select>
      <button id="start" class="primary">집중 시작</button>
      <button id="pause" hidden>일시정지</button>
      <button id="stop" class="ghost" hidden>그만두기</button>
    </div>
    <p id="status" class="status">시작을 누르면 위치 권한을 물어봐요.</p>
  </section>

  <section id="arrival" class="card arrival" hidden>
    <p class="arrival-title">🏁 도착했어요!</p>
    <p>오늘의 여행지는 <strong id="dest-name"></strong> <span id="dest-kind" class="tag"></span></p>
    <p class="muted">여기서 약 <span id="dest-distance"></span>. 쉬는 시간에 진짜로 걸어가 볼까요?</p>
    <a id="dest-link" class="button primary" target="_blank" rel="noopener">카카오맵으로 길 찾기</a>
  </section>

  <div id="map"></div>

  <section class="card today">
    <p class="today-title">오늘의 기록</p>
    <p id="today-summary">아직 기록이 없어요.</p>
    <ul id="today-trips"></ul>
  </section>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
