<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>걸음모도로</title>
  <!-- 휴대폰 홈 화면에 앱처럼 추가하기 위한 설정 -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="걸음모도로">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="map"></div>

  <!-- 위쪽 떠 있는 버튼들 -->
  <header class="topbar">
    <div class="brand"><span id="brand-emoji">🐢</span> 걸음모도로</div>
    <div class="top-actions">
      <button id="btn-character" class="round" aria-label="캐릭터 고르기"><span id="char-emoji">🐢</span></button>
      <button id="btn-style" class="round" aria-label="지도 모양 바꾸기">🗺️</button>
      <button id="btn-overview" class="round" aria-label="전체 경로 보기" hidden>🧭</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- 아래쪽 카드 -->
  <section class="sheet">
    <div id="journey-empty" class="journey">
      <div>
        <p class="eyebrow">오늘의 여정</p>
        <p class="journey-title">어디까지 걸어가 볼까요?</p>
      </div>
      <button id="btn-dest-empty" class="pill primary">목적지 정하기</button>
    </div>

    <div id="journey-set" class="journey" hidden>
      <div class="journey-info">
        <p class="eyebrow"><span id="journey-mode"></span></p>
        <p class="journey-title"><span>🏁</span> <span id="journey-name"></span></p>
        <div class="progress"><div id="journey-bar" class="progress-bar"></div></div>
        <p id="journey-text" class="muted small"></p>
      </div>
      <button id="btn-dest-change" class="pill">바꾸기</button>
    </div>

    <div class="timer-row">
      <div class="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle id="ring-fill" class="ring-fill" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="ring-text">
          <div id="clock" class="clock">25:00</div>
          <div id="clock-sub" class="muted small">집중 준비</div>
        </div>
      </div>
      <div class="timer-controls">
        <div id="minute-chips" class="chips" role="radiogroup" aria-label="집중 시간">
          <button class="chip active" data-min="25">25분</button>
          <button class="chip" data-min="50">50분</button>
          <button class="chip" data-min="60">60분</button>
        </div>
        <button id="btn-start" class="big primary">집중 시작</button>
        <div class="row">
          <button id="btn-pause" class="pill" hidden>일시정지</button>
          <button id="btn-stop" class="pill ghost" hidden>그만두기</button>
        </div>
      </div>
    </div>

    <p id="status" class="status"></p>
    <p id="today" class="today"></p>
  </section>

  <!-- 목적지 고르기 -->
  <div id="dest-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <p class="modal-title">어디로 걸어갈까요?</p>
        <button class="close" data-close="dest-modal" aria-label="닫기">✕</button>
      </div>
      <form id="search-form" class="search">
        <input id="search-input" type="search" placeholder="예: 제주도, 남산서울타워, 한강공원" autocomplete="off" enterkeyhint="search">
        <button class="pill primary" type="submit">검색</button>
      </form>
      <ul id="search-results" class="results"></ul>
      <div class="divider"><span>또는</span></div>
      <div class="options">
        <button id="btn-random" class="option">
          <span class="option-emoji">🎲</span>
          <span><b>근처 추천 여행지</b><br><span class="muted small">집중 시간 안에 갈 수 있는 공원·카페 중 하나</span></span>
        </button>
        <button id="btn-pick" class="option">
          <span class="option-emoji">📍</span>
          <span><b>지도에서 직접 찍기</b><br><span class="muted small">지도를 눌러서 목적지를 골라요</span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- 캐릭터 고르기 -->
  <div id="char-modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <p class="modal-title">누구랑 걸을까요?</p>
        <button class="close" data-close="char-modal" aria-label="닫기">✕</button>
      </div>
      <div id="char-grid" class="char-grid"></div>
    </div>
  </div>

  <!-- 집중 끝 -->
  <div id="done-modal" class="modal" hidden>
    <div class="modal-card done">
      <div id="done-emoji" class="done-emoji">🏁</div>
      <p id="done-title" class="modal-title"></p>
      <p id="done-text" class="muted"></p>
      <a id="done-link" class="big primary" target="_blank" rel="noopener" hidden>카카오맵으로 진짜 걸어가기</a>
      <button class="big" data-close="done-modal">좋아요</button>
    </div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/static/vendor/maplibre/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
