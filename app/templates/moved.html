<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="origin">
  <link rel="canonical" href="{{ target }}/">
  <title>Pomotrip이 이사했어요</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff6ec; color: #3a2e2a;
           font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; text-align: center; }
    a { color: #2f9e6e; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p style="font-size:56px;margin:0">🍅🚚</p>
    <p>Pomotrip이 새 주소로 이사했어요.<br>잠시 후 자동으로 이동해요.</p>
    <p><a id="go" href="{{ target }}/">{{ target }}</a></p>
  </main>
  <script>
    // 이 기기에 저장된 기록(walkmodoro:로 시작하는 값)을 새 주소로 함께 가져가요.
    // 주소의 # 뒤에 실어 보내서 서버에는 전달되지 않아요.
    (() => {
      const target = {{ target | tojson }};
      let hash = "";
      try {
        const data = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith("walkmodoro:")) data[key] = localStorage.getItem(key);
        }
        if (Object.keys(data).length) {
          const bytes = new TextEncoder().encode(JSON.stringify(data));
          let bin = "";
          bytes.forEach((b) => (bin += String.fromCharCode(b)));
          hash = "#move=" + btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }
      } catch {}
      const url = target + "/" + hash;
      document.getElementById("go").href = url;
      setTimeout(() => location.replace(url), 600);
    })();
  </script>
</body>
</html>
