# Render 배포 설정 (Blueprint). Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면 읽혀요.
services:
  - type: web
    name: walkmodoro
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # 비워 두면 데모 지도(직선 거리 원)로 동작해요. 나중에 대시보드에서 넣어도 돼요.
      - key: ORS_API_KEY
        sync: false
      # 로그인 쿠키 서명용 비밀값: Render가 무작위로 만들어 줘요.
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # 데이터베이스 주소 (Neon 등). 비우면 서버가 다시 시작될 때 기록이 사라져요.
      - key: DATABASE_URL
        sync: false
      # 카카오 로그인 (REST API 키, 선택: Client Secret)
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      # 구글 로그인
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
