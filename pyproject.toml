[project]
name = "walkmodoro"
version = "0.1.0"
description = "집중한 시간만큼 걸어서 갈 수 있는 곳을 보여주는 뽀모도로"
requires-python = ">=3.12"
dependencies = [
    "authlib>=1.9.10",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
